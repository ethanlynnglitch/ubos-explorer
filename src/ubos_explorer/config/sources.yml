# UBOS Explorer - source block configuration.
#
# One entry per statistical table block to extract. Every structural value here
# was verified against the workbooks (see reports/inspection_report.md); the
# pipeline does NOT attempt generic table detection.
#
# Row/column numbers are 1-based Excel coordinates.

scope:
  # Fiscal years strictly before this are parsed, counted and written to
  # rejects.parquet as `out_of_scope_period`, never to the fact table.
  min_fiscal_year: "2016/17"

layouts:
  quarterly_va:
    # Quarterly GDP-by-activity sheets. Identical across all four quarterly
    # workbooks: title row 1, fiscal year row 3 (merged or repeated), quarter
    # row 4, labels in column A, data rows 5-36.
    year_row: 3
    quarter_row: 4
    label_col: 1
    data_rows: [[5, 36]]
    # Structural label rows that carry no data (matched after normalization).
    skip_labels: ["ADJUSTMENTS", "ADJUSTMENT", "Adjustments"]

  annual_isic:
    # Annual publication tables: labels in column B, ISIC code in column C,
    # fiscal years from column D. Header/data rows differ per block.
    label_col: 2
    isic_col: 3
    first_data_col: 4
    skip_labels: []

blocks:
  # ---------------------------------------------------------------- annual --
  - source_id: agdp_2026_06_gdp_cp_level
    file: 06_2026AGDP_Publication_Tables_2025_26_June_Release.xls
    engine: xlrd
    sheet: GDP CP
    layout: annual_isic
    source_table: Table 2.1
    title_cell: [2, 2]
    year_row: 6
    data_rows: [[8, 36], [38, 38]]
    release_id: 2026-06_AGDP
    release_date: 2026-06-04
    frequency: A
    price_basis: current
    adjustment: original
    measure: level
    unit: UGX_bn

  - source_id: agdp_2026_06_gdp_kp_level
    file: 06_2026AGDP_Publication_Tables_2025_26_June_Release.xls
    engine: xlrd
    sheet: GDP KP
    layout: annual_isic
    source_table: Table 3.1
    title_cell: [2, 2]
    year_row: 6
    data_rows: [[8, 36], [38, 38]]
    release_id: 2026-06_AGDP
    release_date: 2026-06-04
    frequency: A
    price_basis: constant_2016_17
    adjustment: original
    measure: level
    unit: UGX_bn

  - source_id: agdp_2026_06_gdp_kp_growth
    file: 06_2026AGDP_Publication_Tables_2025_26_June_Release.xls
    engine: xlrd
    sheet: GDP KP
    layout: annual_isic
    source_table: Table 3.2
    title_cell: [42, 2]
    year_row: 46
    data_rows: [[48, 76], [78, 78]]
    release_id: 2026-06_AGDP
    release_date: 2026-06-04
    frequency: A
    price_basis: constant_2016_17
    adjustment: original
    measure: growth_pct
    unit: pct

  # ------------------------------------ quarterly, June release (Q3 vintage) --
