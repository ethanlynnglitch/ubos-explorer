    file: 06_2026QGDP_Constant_Prices_Q3_2025-26.xlsx
    engine: openpyxl
    sheet: Original_VA
    layout: quarterly_va
    source_table: Table 3
    title_cell: [1, 1]
    # Guard: columns B-F of this sheet hold a stray block of ANNUAL fiscal-year
    # totals. The year/quarter header rule already excludes them; this pins it.
    first_data_col: 9
